<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #menu {
  padding: 50px 20px;
  background: #f4f4f4;
  text-align: center;
}

.menu-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
  margin-top: 30px;
}

.item {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  width: 280px;
}

.item img {
  width: 100%;
  border-radius: 8px;
  height: 200px;
  object-fit: cover;
}

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 10px;
  margin-top: 100px;
}

    </style>
</head>
<body>
    <section id="menu">
        <h2>Our Menu</h2>
        <div class="menu-items">
          <div class="item">
            <img src="https://thumbs.dreamstime.com/z/traditional-margherita-pizza-topped-fresh-mozzarella-cherry-tomatoes-basil-classic-margherita-pizza-topped-fresh-328844232.jpg" alt="Pizza" />
            <h3>Pizza</h3>
            <p>Classic Margherita with fresh mozzarella.</p>
          </div>
          <div class="item">
            <img src="https://thumbs.dreamstime.com/b/grilled-chicken-burger-cheddar-fries-ultimate-freshness-indulgence-juicy-topped-fresh-lettuce-ripe-tomato-cheese-349503876.jpg" alt="Burger" />
            <h3>Burger</h3>
            <p>Juicy grilled chicken burger with fries.</p>
          </div>
          <div class="item">
            <img src="https://www.archanaskitchen.com/images/archanaskitchen/0-Archanas-Kitchen-Recipes/2018/May-31/Creamy_Cauliflower_Alfredo_Pasta_Recipe-1_400.jpg" alt="Pasta" />
            <h3>Pasta</h3>
            <p>Creamy Alfredo Pasta with garlic bread.</p>
          </div>
        </div>
      </section>
    
      <footer>
        <p>&copy; 2025 Delicious Bites. All rights reserved.</p>
      </footer>
</body>
</html>
